# web, worker, and migrate are the same image running different commands.
# Pinning one explicit image name means a single build updates all three and they
# can never drift apart.
x-app: &app
  build: .
  image: glean-consumer-research:local
  env_file: .env

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consumer_research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies Drizzle migrations, then creates the bootstrap admin if no users exist.
  migrate:
    <<: *app
    command: npm run db:migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs the parse -> sentiment -> finalize pipeline and Glean analysis jobs.
  worker:
    <<: *app
    command: npm run worker
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
